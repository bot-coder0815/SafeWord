services:
  db:
    image: postgres:16-alpine
    container_name: safeword-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safeword
      POSTGRES_PASSWORD: safeword
      POSTGRES_DB: safeword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: safeword-api:latest
    container_name: safeword-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://safeword:safeword@db:5432/safeword
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: safewordbot:latest
    container_name: safewordbot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://safeword:safeword@db:5432/safeword
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
