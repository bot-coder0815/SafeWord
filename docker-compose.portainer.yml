services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    container_name: safeword-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safeword
      POSTGRES_PASSWORD: safeword
      POSTGRES_DB: safeword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: safeword-api:latest
    pull_policy: never
    container_name: safeword-api
    restart: unless-stopped
    environment: &common
      DATABASE_URL: postgresql://safeword:safeword@db:5432/safeword
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      BOT_OWNER_IDS: ${BOT_OWNER_IDS}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DASHBOARD_URL: ${DASHBOARD_URL}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL}
      ADMIN_WHITELIST_IDS: ${ADMIN_WHITELIST_IDS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      COOKIE_SECURE: ${COOKIE_SECURE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      AVATAR_WEBHOOK_SECRET: ${AVATAR_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    image: safewordbot:latest
    pull_policy: never
    container_name: safewordbot
    restart: unless-stopped
    environment: *common
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
